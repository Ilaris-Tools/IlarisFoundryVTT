name: Ilaris E2E

on:
    pull_request:
        branches: [develop]
        types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
    contents: read

jobs:
    activation-notice:
        name: Explain E2E activation requirements
        if: github.event.pull_request.head.repo.full_name != github.repository || vars.ILARIS_E2E_ENABLED != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Explain why E2E tests did not run
              shell: bash
              run: |
                  echo 'E2E tests did not run: this workflow requires a same-repository PR and ILARIS_E2E_ENABLED=true.' >> "$GITHUB_STEP_SUMMARY"
                  echo 'Before activation, an administrator must arrange a trusted execution boundary for this public repository runner. PR-editable YAML conditions are not that boundary.' >> "$GITHUB_STEP_SUMMARY"

    e2e:
        name: Full E2E on ilaris-dev
        if: github.event.pull_request.head.repo.full_name == github.repository && vars.ILARIS_E2E_ENABLED == 'true'
        runs-on: [self-hosted, Linux, X64, ilaris-dev]
        timeout-minutes: 120
        steps:
            - name: Record tested revisions
              shell: bash
              env:
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_MERGE_SHA: ${{ github.sha }}
              run: |
                  printf 'PR head: `%s`\n\nTested merge commit: `%s`\n' "$PR_HEAD_SHA" "$PR_MERGE_SHA" >> "$GITHUB_STEP_SUMMARY"

            - name: Checkout PR merge commit
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
                  clean: true

            - name: Install dependencies and compile compendiums
              shell: bash
              run: |
                  node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
                  if ! command -v python3 >/dev/null; then
                    apt-get update
                    apt-get install -y python3
                  fi
                  command -v flock
                  command -v setsid
                  npm ci
                  npm run pack-all
                  npx playwright install chromium

            - name: Reset world, deploy this PR and run the full suite
              shell: bash
              run: |
                  set -euo pipefail
                  exec 9>/run/lock/ilaris-e2e.lock
                  flock --wait 1800 9
                  data=/var/lib/foundryvtt
                  worlds="$data/Data/worlds"
                  world=ilaris-e2e-world-v14363-r1
                  world_path="$worlds/$world"
                  system_path="$data/Data/systems/Ilaris"
                  config="$GITHUB_WORKSPACE/.ilaris-ci-playwright.config.ts"
                  test -f /opt/foundryvtt/main.js
                  test -d "$data/Config"
                  test -L "$system_path"
                  test ! -L "$world_path"
                  had_world=0
                  if [ -e "$world_path" ]; then test -d "$world_path"; had_world=1; fi
                  original_system=$(readlink "$system_path")
                  state=$(systemctl is-active foundryvtt || true)
                  case "$state" in active) was_running=1;; inactive|failed) was_running=0;; *) exit 1;; esac
                  stage=$(mktemp -d "$worlds/.ilaris-ci.XXXXXX")
                  chmod 700 "$stage"
                  service_stopped=0
                  foundry_pid=; test_pid=

                  stop_owned() {
                    local pid=$1
                    if [ -n "$pid" ]; then
                      kill -TERM -- "-$pid" 2>/dev/null || true
                      for attempt in {1..100}; do
                        kill -0 -- "-$pid" 2>/dev/null || break
                        sleep 0.1
                      done
                      if kill -0 -- "-$pid" 2>/dev/null; then kill -KILL -- "-$pid" 2>/dev/null || true; fi
                      wait "$pid" 2>/dev/null || true
                    fi
                  }
                  cleanup() {
                    local rc=$? cleanup_failed=0
                    trap - EXIT
                    trap '' INT TERM
                    set +e
                    stop_owned "$test_pid"
                    stop_owned "$foundry_pid"
                    # Also cover a signal arriving immediately after launch, before $! was saved.
                    for pid in $(jobs -pr); do stop_owned "$pid"; done
                    if [ -L "$system_path" ] && [ "$(readlink "$system_path")" = "$GITHUB_WORKSPACE" ]; then
                      unlink "$system_path" || cleanup_failed=1
                    fi
                    if [ ! -e "$system_path" ] && [ ! -L "$system_path" ]; then
                      ln -s "$original_system" "$system_path" || cleanup_failed=1
                    elif [ ! -L "$system_path" ] || [ "$(readlink "$system_path")" != "$original_system" ]; then
                      cleanup_failed=1
                    fi
                    # Derive rollback from filesystem state, not flags set after mv/ln.
                    if [ -d "$stage/previous-world" ]; then
                      if [ -e "$world_path" ] || [ -L "$world_path" ]; then rm -rf -- "$world_path" || cleanup_failed=1; fi
                      mv -- "$stage/previous-world" "$world_path" || cleanup_failed=1
                    elif [ "$had_world" = 0 ] && [ -d "$stage/fresh" ] && [ ! -e "$stage/fresh/$world" ]; then
                      if [ -e "$world_path" ] || [ -L "$world_path" ]; then rm -rf -- "$world_path" || cleanup_failed=1; fi
                    fi
                    if [ "$service_stopped" = 1 ] && [ "$was_running" = 1 ]; then
                      systemctl start foundryvtt || cleanup_failed=1
                    fi
                    rm -f -- "$config"
                    if [ "$rc" = 0 ] && [ "$cleanup_failed" = 0 ]; then rm -rf -- "$stage";
                    else echo "Host-only startup log / recovery data: $stage"; fi
                    if [ "$cleanup_failed" != 0 ]; then
                      echo 'Host restoration failed; stop further CI jobs and inspect the staging directory.' >&2
                      [ "$rc" != 0 ] || rc=1
                    fi
                    exit "$rc"
                  }
                  trap cleanup EXIT
                  trap 'exit 130' INT
                  trap 'exit 143' TERM

                  # Validate everything before stopping Foundry or replacing its data.
                  python3 - "$GITHUB_WORKSPACE" "$stage" "$world" "$original_system" "$was_running" <<'PY'
                  import hashlib, json, pathlib, stat, sys, zipfile
                  root, stage = map(pathlib.Path, sys.argv[1:3])
                  world, original_system, was_running = sys.argv[3:]
                  manifest = json.loads((root / 'e2e/fixtures/baselines/manifest.json').read_text())
                  assert manifest['worldId'] == manifest['worldDirectory'] == world
                  assert manifest['systemId'] == 'Ilaris'
                  assert pathlib.Path(manifest['archive']).name == manifest['archive']
                  archive = root / 'e2e/fixtures/baselines' / manifest['archive']
                  assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['sha256'].lower(), 'Baseline checksum mismatch'
                  system = json.loads((root / 'system.json').read_text())
                  assert system['id'] == 'Ilaris'
                  for pack in system['packs']:
                      directory = (root / pack['path']).resolve()
                      assert directory.is_relative_to(root.resolve())
                      current = (directory / 'CURRENT').read_text().strip()
                      assert current.startswith('MANIFEST-') and pathlib.Path(current).name == current
                      assert (directory / current).is_file(), 'Compiled pack is incomplete'
                  with zipfile.ZipFile(archive) as z:
                      for entry in z.infolist():
                          p = pathlib.PurePosixPath(entry.filename)
                          assert not p.is_absolute() and '..' not in p.parts and p.parts and p.parts[0] == world
                          assert '\\' not in entry.filename
                          assert stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR)
                      assert world + '/world.json' in z.namelist()
                      z.extractall(stage / 'fresh')
                  world_info = json.loads((stage / 'fresh' / world / 'world.json').read_text())
                  assert world_info['id'] == world and world_info['system'] == 'Ilaris'
                  (stage / 'recovery.json').write_text(json.dumps({'originalSystemLink': original_system, 'serviceWasRunning': was_running == '1', 'world': world}))
                  PY

                  # Temporary config only: no checked-in fixture or application source is changed.
                  cat > "$config" <<'EOF'
                  import { defineConfig } from '@playwright/test'
                  import base from './playwright.config'
                  export default defineConfig(base, {
                      workers: 1, retries: 0, fullyParallel: false,
                      reporter: [['line'], ['html', { outputFolder: 'playwright-report', open: 'never' }]],
                      use: {
                          headless: true, video: 'off', screenshot: 'only-on-failure', trace: 'retain-on-failure',
                          launchOptions: { args: ['--use-gl=angle', '--use-angle=swiftshader'] },
                      },
                      projects: base.projects?.map(project => ({ ...project, use: { ...project.use, channel: 'chromium' } })),
                  })
                  EOF

                  service_stopped=1
                  systemctl stop foundryvtt
                  node <<'EOF'
                  const net = require('node:net');
                  const server = net.createServer();
                  server.once('error', () => { console.error('Port 30000 is still occupied'); process.exitCode = 1; });
                  server.listen(30000, '127.0.0.1', () => server.close());
                  EOF
                  if [ -e "$world_path" ]; then
                    test -d "$world_path"
                    mv -- "$world_path" "$stage/previous-world"
                  fi
                  mv -- "$stage/fresh/$world" "$world_path"
                  unlink "$system_path"
                  ln -s "$GITHUB_WORKSPACE" "$system_path"

                  setsid node /opt/foundryvtt/main.js --dataPath="$data" --world="$world" \
                    --port=30000 --noupnp --noupdate > "$stage/foundry.log" 2>&1 &
                  foundry_pid=$!
                  ready=0
                  deadline=$((SECONDS + 180))
                  while [ "$SECONDS" -lt "$deadline" ]; do
                    kill -0 "$foundry_pid" 2>/dev/null || { echo 'Foundry exited during startup'; exit 1; }
                    if final_url=$(curl --fail --silent --show-error --location --max-time 3 \
                      --output "$stage/join.html" --write-out '%{url_effective}' http://127.0.0.1:30000/join 2>/dev/null); then
                      if [ "$final_url" = http://127.0.0.1:30000/join ] && \
                        grep -q 'e2e-gm' "$stage/join.html" && grep -q 'e2e-player' "$stage/join.html"; then ready=1; break; fi
                    fi
                    sleep 0.5
                  done
                  [ "$ready" = 1 ] || { echo 'Baseline join page was not ready within 180 seconds'; exit 1; }

                  E2E_FOUNDRY_URL=http://127.0.0.1:30000 E2E_CI_HEADLESS=true \
                    PLAYWRIGHT_CHROMIUM_CHANNEL=chromium setsid node node_modules/@playwright/test/cli.js \
                    test --config="$config" &
                  test_pid=$!
                  wait "$test_pid"

            - name: Upload E2E reports and failure evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: ilaris-e2e-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
